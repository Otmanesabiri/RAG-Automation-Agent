version: 2
updates:
  # No pip updates: Dependabot rewrites requirements.txt without the constraints of
  # requirements.in or the CPU-only torch backend (it once upgraded the Elasticsearch
  # client to a major the 8.x cluster rejects and brought back the CUDA wheels).
  # Update Python dependencies by regenerating the lock (command in requirements.in).

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
